[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalops"
version = "0.1.0"
description = "Open-source tools for running LLMs in production: plan a deployment, benchmark a server. Pure Python, no dependencies."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "VitalOps" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
vitalops = "vitalops.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://vitalops.ai/oss/"
Source = "https://github.com/vitalops/vitalops"

[tool.setuptools.packages.find]
include = ["vitalops*"]

[tool.setuptools.package-data]
vitalops = ["ui/*"]
